<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
    }
    .contador {
      min-width: 220px;
      padding: 28px 36px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
    }
    .etiqueta {
      margin: 0 0 8px;
      color: #666;
      font-size: .9rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #visitas {
      font-size: clamp(2.5rem, 10vw, 4rem);
      line-height: 1.1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    #estado { margin-top: 10px; color: #777; font-size: .8rem; }
  </style>
</head>
<body>
  <main class="contador" aria-live="polite">
    <p class="etiqueta">Visitas</p>
    <div id="visitas">—</div>
    <div id="estado">Cargando contador…</div>
  </main>

  <!--
    1. Crea un workspace gratuito en https://app.counterapi.dev/register
    2. Cambia "TU_WORKSPACE" por el nombre exacto de tu workspace.
    3. Usa un nombre de contador único para tu web.
  -->



<script>
const WORKSPACE = "pedro-sbrs-team-5983";
const TOKEN = "PEGA_AQUI_TU_TOKEN";
const CONTADOR = "visitas-web";

const numero = document.getElementById("visitas");
const estado = document.getElementById("estado");

const base = `https://api.counterapi.dev/v2/${WORKSPACE}/${CONTADOR}`;

async function peticion(url) {
  const respuesta = await fetch(url, {
    headers: {
      "Authorization": `Bearer ${TOKEN}`
    }
  });

  if (!respuesta.ok) {
    throw new Error(`Error HTTP ${respuesta.status}`);
  }

  return respuesta.json();
}

function mostrar(datos) {
  const valor = datos.value ?? datos.data?.up_count;

  if (valor == null || !Number.isFinite(Number(valor))) {
    throw new Error("La API no devolvió un número válido");
  }

  numero.textContent = Number(valor).toLocaleString("es-ES");
  estado.textContent = "Actualizado";
}

async function iniciar() {
  try {
    mostrar(await peticion(`${base}/up`));
    estado.textContent = "Actualizado";

    setInterval(async () => {
      try {
        mostrar(await peticion(base));
      } catch (error) {
        console.error(error);
        estado.textContent = "Error al actualizar";
      }
    }, 30000);

  } catch (error) {
    console.error("Error de CounterAPI:", error);
    estado.textContent = error.message;
  }
}

iniciar();
</script>


</body>
</html>
